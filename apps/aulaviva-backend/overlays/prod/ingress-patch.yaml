apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aulaviva-ingress
spec:
  rules:
    - host: prod.aulaviva.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aulaviva-backend
                port:
                  number: 80
